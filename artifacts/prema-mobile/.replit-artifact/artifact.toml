kind = "mobile"
previewPath = "/prema-mobile/"
title = "Prema Mobile"
version = "1.0.0"
id = "artifacts/prema-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/prema-mobile/" ]
localPort = 22570

[services.development]
run = "pnpm --filter @workspace/prema-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prema-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/prema-mobile", "run", "serve" ]

[services.env]
PORT = "22570"
BASE_PATH = "/prema-mobile/"
